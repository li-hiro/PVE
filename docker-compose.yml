# ---------------------------------------------------------------------------
# VirtGate 一键编排：Fastify 控制平面 + Nginx 门户
#   cp .env.example .env && bash scripts/deploy.sh
# ---------------------------------------------------------------------------
name: virtgate

services:
  server:
    build:
      context: ./server
    image: virtgate/server:1.0.0
    container_name: virtgate-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_PATH: /app/data/virtgate.db
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?请在 .env 中设置 ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEMO_MODE: ${DEMO_MODE:-true}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin@12345}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Demo@12345}
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      SYNC_INTERVAL_SEC: ${SYNC_INTERVAL_SEC:-30}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-7}
      CONSOLE_TTL_SEC: ${CONSOLE_TTL_SEC:-300}
      ALERT_CPU_THRESHOLD: ${ALERT_CPU_THRESHOLD:-85}
      ALERT_MEM_THRESHOLD: ${ALERT_MEM_THRESHOLD:-90}
      ALERT_DISK_THRESHOLD: ${ALERT_DISK_THRESHOLD:-92}
      ANOMALY_WINDOW_MINUTES: ${ANOMALY_WINDOW_MINUTES:-10}
      ANOMALY_DESTRUCTIVE_BURST: ${ANOMALY_DESTRUCTIVE_BURST:-3}
      ANOMALY_FAILURE_BURST: ${ANOMALY_FAILURE_BURST:-5}
      ANOMALY_DENIAL_BURST: ${ANOMALY_DENIAL_BURST:-3}
      ANOMALY_LOGIN_FAILURE_BURST: ${ANOMALY_LOGIN_FAILURE_BURST:-5}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_TIMEOUT_MS: ${ALERT_WEBHOOK_TIMEOUT_MS:-5000}
    volumes:
      - virtgate-data:/app/data
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - virtgate

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE: /api/v1
    image: virtgate/web:1.0.0
    container_name: virtgate-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - virtgate

volumes:
  virtgate-data:
    name: virtgate-data

networks:
  virtgate:
    name: virtgate
